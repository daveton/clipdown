# Web
Web:
  # APP Switch
  PyWebIO_Enable: true    # Enable APP | 启用APP

  # APP Information
  Domain: http://localhost    # Web domain | Web域名 (修改为本地/NAS地址)

  # APP Configuration
  PyWebIO_Theme: minty    # PyWebIO theme | PyWebIO主题
  Max_Take_URLs: 30    # Maximum number of URLs that can be taken at a time | 一次最多可以取得的URL数量


  # Web Information
  Tab_Title: ClipDown    # Web title | Web标题
  Description: ClipDown is a video download tool for Douyin/TikTok/Bilibili. Simple, fast, and easy to deploy on NAS.    # Web description | Web描述
  Favicon: /app/logo/logo192.png    # Web favicon | Web图标 (本地路径)

  # Fun Configuration
  Easter_Egg: false    # Disable Easter Egg | 禁用彩蛋
  Live2D_Enable: false    # Disable Live2D | 禁用看板娘
  Live2D_JS:

# API
API:
  # Network Configuration
  Host_IP: 0.0.0.0    # default IP | 默认IP
  Host_Port: 80    # default port is 80 | 默认端口为80
  Docs_URL: /docs    # API documentation URL | API文档URL
  Redoc_URL: /redoc    # API documentation URL | API文档URL

  # API Information
  Version: V4.1.2    # API version | API版本
  Update_Time: 2025/03/16    # API update time | API更新时间
  Environment: Demo    # API environment | API环境

  # Download Configuration
  Download_Switch: true    # Enable download function | 启用下载功能

  # File Configuration
  Download_Path: "./download"    # Default download directory | 默认下载目录
  Download_File_Prefix: "clipdown_"    # Default download file prefix | 默认下载文件前缀


# iOS Shortcut (已移除原快捷指令链接，可自行创建)
iOS_Shortcut:
  iOS_Shortcut_Version: ""
  iOS_Shortcut_Update_Time: ""
  iOS_Shortcut_Link: ""
  iOS_Shortcut_Link_EN: ""
  iOS_Shortcut_Update_Note: ""
  iOS_Shortcut_Update_Note_EN: ""
