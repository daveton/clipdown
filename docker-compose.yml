version: "3.9"

services:
  clipdown:
    build: .  # 本地构建镜像
    image: clipdown:latest
    container_name: clipdown
    restart: unless-stopped
    ports:
      - "8080:80"  # 映射到主机8080端口
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./download:/app/download  # 下载目录持久化
      - ./logo:/app/logo:ro  # Logo文件
    environment:
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
